

name: Build DOWN TEST iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build-ios:
    name: Build DOWN TEST for iPhone
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build iOS Simulator app
        working-directory: ios
        run: |
          xcodebuild \
            -project DOWN_TEST.xcodeproj \
            -scheme DOWN_TEST \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: DOWN-TEST-iOS-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/DOWN_TEST.app
