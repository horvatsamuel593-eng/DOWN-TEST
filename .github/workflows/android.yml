


name: Build DOWN TEST APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/cz/downtest/app/MainActivity.kt'
      - 'icon-512.png'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          echo "Using ZIP: $ZIP"
          unzip -o "$ZIP" -d project

      - name: Find project and apply fixed files
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          if [ -f app/build.gradle.kts ]; then
            cp app/build.gradle.kts "$PROJECT_DIR/app/build.gradle.kts"
          fi

          if [ -f app/src/main/java/cz/downtest/app/MainActivity.kt ]; then
            mkdir -p "$PROJECT_DIR/app/src/main/java/cz/downtest/app"
            cp app/src/main/java/cz/downtest/app/MainActivity.kt "$PROJECT_DIR/app/src/main/java/cz/downtest/app/MainActivity.kt"
          fi

          echo "$PROJECT_DIR" > project_path.txt

      - name: Create DOWN TEST Android icons
        run: |
          test -f icon-512.png
          python -m pip install Pillow

          PROJECT_DIR=$(cat project_path.txt)
          RES="$PROJECT_DIR/app/src/main/res"

          mkdir -p "$RES"

          python - <<'PY'
          from PIL import Image
          import os

          image = Image.open("icon-512.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          project_dir = open("project_path.txt").read().strip()
          res = os.path.join(project_dir, "app", "src", "main", "res")

          for density, size in sizes.items():
              folder = os.path.join(res, "mipmap-" + density)
              os.makedirs(folder, exist_ok=True)

              icon = image.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(os.path.join(folder, "ic_launcher.png"))
              icon.save(os.path.join(folder, "ic_launcher_round.png"))

          print("DOWN TEST icons created successfully.")
          PY

          python - <<'PY'
          import re
          import os

          project_dir = open("project_path.txt").read().strip()
          manifest = os.path.join(
              project_dir, "app", "src", "main", "AndroidManifest.xml"
          )

          if not os.path.isfile(manifest):
              raise SystemExit("AndroidManifest.xml not found!")

          with open(manifest, encoding="utf-8") as f:
              content = f.read()

          match = re.search(r"<application\b[^>]*>", content, re.S)
          if not match:
              raise SystemExit("Application tag not found!")

          tag = match.group(0)

          for attribute in ("icon", "roundIcon"):
              pattern = r'\s+android:' + attribute + r'="[^"]*"'
              replacement = ' android:' + attribute + '="@mipmap/ic_launcher"'

              if re.search(pattern, tag):
                  tag = re.sub(pattern, replacement, tag)
              else:
                  tag = tag[:-1] + replacement + ">"

          content = content[:match.start()] + tag + content[match.end():]

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(content)

          print("DOWN TEST launcher icon configured.")
          PY

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_path.txt)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DOWN-TEST-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
